<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting — Hem Tilva</title>
    <script>
      var path = window.location.pathname;
      if (path.includes('project')) {
        window.location.replace('/#/projects');
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">hemtilva.github.io</a>...</p>
  </body>
</html>
